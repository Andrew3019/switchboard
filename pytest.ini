# Test configuration. Deliberately `pytest.ini` and not `pyproject.toml`: switchboard is
# not a package and is never installed (see the note at the top of `requirements.txt`), so
# a pyproject would say something about this repo that is not true. This file says only
# how to run the tests.
[pytest]
testpaths = tests

# The suite is ~1740 tests and several minutes serial, almost all of it CPU and tmpdir
# work with no shared state, so it parallelises cleanly. `-n auto` uses one worker per
# core. To run serially — debugging a hang, reading interleaved output, using `pdb` —
# pass `-n0`, which overrides this.
addopts = -n auto
