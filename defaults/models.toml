# What a model TIER means. The only file in the tree where a model name appears.
#
# A tier is a human-readable name — `cheap`, `default`, `strong`, or anything you invent —
# that maps to a provider, a model and an effort level. Roles and commands name tiers only;
# nothing outside models.py ever learns what one resolves to. The set is open vocabulary,
# so inventing a tier is editing a file, not editing code.
#
# Layered, most general first, each level overriding the last PER TIER:
#
#     defaults/models.toml  ->  ~/.config/switchboard/models.toml  ->  <repo>/.switchboard/models.toml
#
# Per-tier means overriding one field of `strong` leaves its provider and model alone.
# `sb models` prints the resolved table.

[defaults]
# Used by tiers that omit `provider`, and by the passthrough escape hatch: an unknown tier
# name is handed to this provider verbatim as a model id, so you can pin a specific model
# without inventing a tier for it.
provider = "claude"


# -- the shipped tiers ---------------------------------------------------------
#
# Small on purpose: this only has to be good enough that switchboard works with no config
# file at all. Four of the six shipped roles name a tier here; `reviewer` and `worker` are
# deliberately on `default` and the note in each says why. See `notes/model-selection.md`
# for the role-by-role reasoning and what it costs.
#
# ALIASES, never pinned ids. `claude --help` documents --model as taking "an alias for the
# latest model (e.g. 'fable', 'opus', or 'sonnet') or a model's full name". An alias
# follows the current model of its class and keeps working as models churn; a pinned id
# fails outright the day it is retired or your plan loses access to it. `prose` is the one
# exception and says at its own definition why it earns it.

# No tier uses haiku. `--permission-mode auto` is MODEL-DEPENDENT: it runs a classifier
# that decides what still needs approval, and haiku's is far more conservative. Verified
# with the identical command under the identical flag — haiku blocked on a permission
# prompt ("Multiple directory changes in one command require approval for clarity") while
# opus ran it. An agent that stops for a human on ordinary shell commands is not cheap,
# it is unusable unattended. Cheapness comes from effort, not from a smaller model.
[tiers.cheap]
# `medium`, not `low`. The tier had one consumer, `researcher`, and the researcher's job
# changed underneath it: an orchestrator's FIRST move is now to spend one agent
# understanding a task before splitting it, and that agent is usually a researcher. So the
# tier that was chosen for "one of five parallel readers, none of them load-bearing" became
# the tier every subsequent split depends on. Low effort was the wrong place to save money
# once one report decides how the whole job gets divided.
#
# Still the cheap tier and still cheap the same WAY — sonnet, with effort as the dial (see
# the note above about haiku). One notch, in the one place a bad answer is expensive.
#
# Read this before using `--model cheap` expecting the old behaviour: it is now sonnet at
# medium effort everywhere, not just for researchers.
provider = "claude"
model    = "sonnet"
effort   = "medium"

[tiers.default]
# No model and no effort: whatever the provider CLI itself defaults to. Deliberately not a
# pinned choice — the CLI's own default is the best-maintained answer to that question.
provider = "claude"

[tiers.standard]
# The older name for `default`. Still honoured so config written against it keeps working.
provider = "claude"

[tiers.careful]
# Sonnet with the effort dial up one more notch than `cheap`. For work that is judgement
# rather than reading, but tool-driven rather than deep reasoning — `qa` is the shipped
# consumer: running the checks and telling a real defect from your own bad invocation.
# Same price per token as `cheap`; the difference is how long it thinks.
provider = "claude"
model    = "sonnet"
effort   = "high"

[tiers.strong]
provider = "claude"
model    = "opus"
effort   = "high"

# NO TIER USES `xhigh`, AND NONE MAY. There was a `deep` tier here for one day — opus at
# xhigh, for workers — and Andrew removed it on sight (2026-08-16): "i dont want anything to
# ever use xhigh". It stays a standing rule rather than a judgement to remake, so a tier
# proposing it is wrong before its reasoning is read. `xhigh` remains in `effort_levels`
# below because that list says what the CLI ACCEPTS, which is a fact and not a preference —
# the prohibition is here, where tiers are chosen.

[tiers.prose]
# THE ONE TIER THAT PINS AN ID, against the rule three paragraphs up. It exists because the
# choice it encodes is not "the current Opus" — it is *that* Opus, and an alias cannot say
# so. Leads write the prose Andrew reads, and the output style of the model the `opus` alias
# currently points at is the thing being avoided (`notes/model-selection.md`: the verbosity,
# hedging and apology loops the community named within a week of launch). Same price as
# `strong`, so this is a behaviour choice and never a cost one.
#
# Accepting the cost of a pinned id knowingly: the day this id is retired, spawns on this
# tier fail outright. That is the correct failure — it asks the question again rather than
# silently sliding onto the model this tier was invented to avoid. When it happens, re-read
# the table in `notes/model-selection.md` and pick again.
provider = "claude"
model    = "claude-opus-4-8"
effort   = "high"


# -- what the code can actually do ---------------------------------------------
#
# These two are facts about the backends switchboard has, not preferences, so a repo does
# not get to override them: claiming an effort level the CLI rejects, or a provider with no
# adapter behind it, would fail at spawn time instead of at resolution time — where the
# message can still say what is wrong.

[providers]
# Only `claude` is wired. `provider` stays a real field so config written today remains
# valid, but there is no codex backend yet.
wired = ["claude"]

# From `claude --help`: "--effort <level>  Effort level for the current session
# (low, medium, high, xhigh, max)". A flag, not CLAUDE_EFFORT: an inherited env var would
# silently give every child its parent's effort.
effort_levels = ["low", "medium", "high", "xhigh", "max"]
