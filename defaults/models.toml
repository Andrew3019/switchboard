# What a model TIER means. The only file in the tree where a model name appears.
#
# A tier is a human-readable name — `cheap`, `default`, `strong`, or anything you invent —
# that maps to a provider, a model and an effort level. Roles and commands name tiers only;
# nothing outside models.py ever learns what one resolves to. The set is open vocabulary,
# so inventing a tier is editing a file, not editing code.
#
# Layered, most general first, each level overriding the last PER TIER:
#
#     defaults/models.toml  ->  ~/.config/switchboard/models.toml  ->  <repo>/.switchboard/models.toml
#
# Per-tier means overriding one field of `strong` leaves its provider and model alone.
# `sb models` prints the resolved table.

[defaults]
# Used by tiers that omit `provider`, and by the explicit `raw:<provider-model-id>` escape
# hatch. Unknown tier names are errors so a typo cannot silently become a raw model id.
provider = "claude"


# -- the shipped tiers ---------------------------------------------------------
#
# Small on purpose: this only has to be good enough that switchboard works with no config
# file at all. Seven shipped roles, and every one of them now names a claude tier: `worker`
# is on `default` — a pinned choice now like any other, no longer an unmade one — and
# `builder`, which used to be the one role on a non-claude provider, is on `opus-5-medium`
# since the codex tier it pinned was retired (see that tier, and `gpt-luna-max-effort` in
# the codex section, for why). See `notes/model-selection.md` for the role-by-role
# reasoning and what it costs.
#
# PINNED IDS on the Claude tiers. `claude --help` documents --model as taking "an alias for
# the latest model (e.g. 'fable', 'opus', or 'sonnet') or a model's full name". An alias
# follows the current model of its class and keeps working as models churn; a pinned id
# fails outright the day it is retired or your plan loses access to it. `default`, `cheap`,
# `careful`, `strong` and `prose` name concrete versioned ids and accept that cost
# knowingly — see `prose` at its own definition for the argument. Alias passthrough stays
# available as the escape hatch: hand one straight to the resolver, or name one in a tier
# of your own.

# No tier uses haiku. `--permission-mode auto` is MODEL-DEPENDENT: it runs a classifier
# that decides what still needs approval, and haiku's is far more conservative. Verified
# with the identical command under the identical flag — haiku blocked on a permission
# prompt ("Multiple directory changes in one command require approval for clarity") while
# opus ran it. An agent that stops for a human on ordinary shell commands is not cheap,
# it is unusable unattended. Cheapness comes from effort, not from a smaller model.
[tiers.cheap]
# `medium`, not `low`. The tier had one consumer, `researcher`, and the researcher's job
# changed underneath it: an orchestrator's FIRST move is now to spend one agent
# understanding a task before splitting it, and that agent is usually a researcher. So the
# tier that was chosen for "one of five parallel readers, none of them load-bearing" became
# the tier every subsequent split depends on. Low effort was the wrong place to save money
# once one report decides how the whole job gets divided.
#
# Still the cheap tier and still cheap the same WAY — sonnet, with effort as the dial (see
# the note above about haiku). One notch, in the one place a bad answer is expensive.
#
# Read this before using `--model cheap` expecting the old behaviour: it is now sonnet at
# medium effort everywhere, not just for researchers.
provider = "claude"
model    = "claude-sonnet-5"
effort   = "medium"

[tiers.default]
# Pins the current flagship, and no effort — the CLI's own level. `default` is the tier a
# role names when it has no reason to want anything else, and what that resolves to should
# be a thing you can look up rather than whatever the `opus` alias moved to this week.
# `standard` below is where "defer to the provider CLI" still lives.
provider = "claude"
model    = "claude-opus-5"

[tiers.standard]
# The older name for `default`. Still honoured so config written against it keeps working.
provider = "claude"

[tiers.careful]
# Sonnet with the effort dial up one more notch than `cheap`. For work that is judgement
# rather than reading, but tool-driven rather than deep reasoning — `qa` is the shipped
# consumer: running the checks and telling a real defect from your own bad invocation.
# Same price per token as `cheap`; the difference is how long it thinks.
provider = "claude"
model    = "claude-sonnet-5"
effort   = "high"

[tiers.strong]
provider = "claude"
model    = "claude-opus-5"
effort   = "high"

[tiers.opus-5-medium]
# The middle notch of the flagship, and `builder`'s tier since its codex pin was retired
# (Andrew, 2026-09-01). `default` is this model at the CLI's own effort and `strong` is it
# at `high`; this is the level between them, named because a role wanted it. Same shape as
# `strong`, one word different.
#
# WHY BUILDER MOVED HERE rather than keeping `gpt-5.6-sol` as a switchable option: what
# that tier was for — good code cheaply, on work whose requirements are already clear — is
# what `gpt-luna-max-effort` below now covers, at less. So the codex pin stopped being
# worth carrying as a runtime choice and became a one-time role edit. `gpt-5.6-sol` is
# still a tier and still reachable by name; nothing is on it.
provider = "claude"
model    = "claude-opus-5"
effort   = "medium"

# No tier pins `xhigh`. A `deep` tier here did — opus at xhigh, for workers — and lasted a
# day (Andrew, 2026-08-16: "i dont want anything to ever use xhigh"). Left as a note rather
# than enforced anywhere: `xhigh` is still a level the CLI takes and still reachable per call
# if someone has a reason, it just is not what a shipped tier hands every spawn of a kind.

[tiers.prose]
# THE ONE TIER THAT PINS AN OLDER ID. The others pin the current generation; this pins the
# PREVIOUS flagship, and deliberately. The choice it encodes is not "the current Opus" — it
# is *that* Opus. Leads write the prose Andrew reads, and the output style of the model
# `strong` now names is the thing being avoided (`notes/model-selection.md`: the verbosity,
# hedging and apology loops the community named within a week of launch). Same price as
# `strong`, so this is a behaviour choice and never a cost one.
#
# Accepting the cost of a pinned id knowingly: the day this id is retired, spawns on this
# tier fail outright. That is the correct failure — it asks the question again rather than
# silently sliding onto the model this tier was invented to avoid. When it happens, re-read
# the table in `notes/model-selection.md` and pick again.
provider = "claude"
model    = "claude-opus-4-8"
effort   = "medium"


# -- the codex tiers -----------------------------------------------------------
#
# PINNED IDS, and not by choice as the Claude tiers are: codex has no alias vocabulary at
# all. `codex debug models` reports slugs and nothing else, so a tier here
# names one — which carries the same cost the Claude tiers accept and say so about: the day a
# slug is retired, spawns on this tier fail outright. That is the correct failure. It asks
# the question again rather than sliding silently onto a different model.
#
# All verified live against the installed codex-cli (`codex debug models`): every slug
# exists and every one lists the effort its tier asks for among its supported reasoning
# levels. The tier NAME is the slug for the two that are chosen as models — for codex there
# is no more human word available, and `gpt-5.5` is what a person picking one would say.
# `gpt-luna-max-effort` is the exception and says why at its own definition: it is chosen
# for a KIND OF WORK rather than for its model, so it is named after that instead.

[tiers."gpt-5.5"]
provider = "codex"
model    = "gpt-5.5"
effort   = "medium"

[tiers."gpt-5.6-sol"]
# The newer frontier model. Its own default reasoning level is `low`; `medium` here is the
# deliberate override, matching `gpt-5.5` so the choice between the two tiers is a choice
# of model and not secretly also a choice of effort (Andrew, 2026-08-22).
#
# NO ROLE IS ON IT any more — `builder` was, and moved to `opus-5-medium` above on
# 2026-09-01. Kept as a tier because retiring a name people type is a separate decision
# from retiring the pin that used it.
provider = "codex"
model    = "gpt-5.6-sol"
effort   = "medium"

[tiers.gpt-luna-max-effort]
# THE DIRECT-PATH TIER, and the only tier in this file with either gate on it. Named for
# what it is FOR rather than for its slug, unlike the two above: a person choosing it is
# choosing "the cheap model, thinking as hard as it can, on work whose requirements are
# already settled", and the slug is the least interesting half of that.
#
# `gpt-5.6-luna` at `max`, both verified live against the installed codex-cli
# (`codex debug models`): the slug exists and `max` is among its supported reasoning
# levels. Its own default is `medium`; `max` here is the whole point of the tier.
#
# WHEN IT IS THE RIGHT TIER (the judgment half, which no code can check): the work is a
# DIRECT-path change per the plans guide — behaviour, scope and a reasonable approach
# already clear, going straight to implement/verify/review/land — or a change too small to
# reach a review at all. Never work still being shaped, never an open design question,
# never investigation. A direct change that turns out to need shaping moves off this tier
# when it moves onto the shaped path, by the guide's own rule.
#
# WHAT THE GATES BELOW DO (the mechanical half, which is a closed fact and therefore code):
#
#   forbidden_roles — refused outright for `lead`, `dispatcher` and `reviewer`, whoever
#     names it. This tier is for an implementation leaf; an agent that splits work, routes
#     it, or gives a verdict on somebody else's change is not that, and `--model
#     gpt-luna-max-effort` on one of those roles is an error rather than a judgment call.
#     `worker` and `builder` are what it is for, and they are not listed here because the
#     list is what is REFUSED — a repo's own leaf role gets the tier without editing this.
#     Role names, so a repo that renames its reviewer renames it here too; the behavioural
#     half of that name lives at `[vocabulary] review_role` in settings.toml.
#
#   enabled_by — the tier resolves only while `[routing] gpt_luna_direct_enabled` is true
#     in settings.toml, and it ships FALSE. One line to turn the whole thing on or off,
#     which is what makes this a routing experiment somebody can end rather than a tier
#     that has to be deleted.
#
# Selection stays EXPLICIT: nothing infers "this work is direct" from a change record and
# swaps a role's model underneath it. Whoever spawns the worker or builder passes
# `--model gpt-luna-max-effort` by hand, the way `--role builder` is asked for by name.
provider        = "codex"
model           = "gpt-5.6-luna"
effort          = "max"
forbidden_roles = ["lead", "dispatcher", "reviewer"]
enabled_by      = "routing.gpt_luna_direct_enabled"


# -- the deepseek tiers --------------------------------------------------------
#
# The same codex BINARY as the two tiers above, pointed at a different API. `provider` is
# still `codex` because that is what herdr starts; `codex_provider` is the new part, and
# it names a `[codex.<name>]` section of `defaults/settings.toml` — the endpoint, the
# wire protocol and the environment variable holding the key all live there, so a machine
# that needs different ones changes config rather than code. `switchboard/codex.py` turns
# that section into the `[model_providers.deepseek]` block of the agent's private
# config.toml and selects it with `model_provider = "deepseek"`.
#
# ANY DeepSeek model works — the tier is where the slug is named, so adding one is adding
# a tier, in your own `models.toml` and with no code change:
#
#     [tiers.deepseek-pro]
#     provider       = "codex"
#     codex_provider = "deepseek"
#     model          = "deepseek-v4-pro"
#     effort         = "high"
#
# Two things a spawn on these tiers needs that switchboard does not supply: `DEEPSEEK_API_KEY`
# exported where the agent's pane can see it, and codex-cli 0.144.0 or newer (the minimum
# DeepSeek's own model catalog declares for the v4 slugs).

[tiers.deepseek]
# A PINNED ID, for the reason the codex tiers above give at more length: there is no alias
# vocabulary to use instead. `deepseek-v4-flash` is the cheap one and the reason this tier
# is shipped rather than left to config — simple work, cheaply (Andrew, 2026-08-25).
#
# `low`, where the two gpt tiers say `medium`, and NOT as a further economy: DeepSeek's own
# model catalog lists `low | high | max` for every v4 model and no `medium` at all, so
# medium here would name a level the model does not have. Their default is `high`; this
# tier exists to be cheap, so it takes the bottom of the three.
provider       = "codex"
codex_provider = "deepseek"
model          = "deepseek-v4-flash"
effort         = "low"

# -- what the code can actually do ---------------------------------------------
#
# These two are facts about the backends switchboard has, not preferences, so a repo does
# not get to override them: claiming an effort level the CLI rejects, or a provider with no
# adapter behind it, would fail at spawn time instead of at resolution time — where the
# message can still say what is wrong.

[providers]
# Both have a backend. `claude` is the default and gets its per-agent settings as CLI
# flags; `codex` gets the same settings as keys in a private per-agent `CODEX_HOME`
# (`switchboard/codex.py`) because it has an equivalent flag for none of them. Which of
# the two a tier means is the `provider` field above, and `Herdr.start_agent` is the one
# place that branches on it.
wired = ["claude", "codex"]

# From `claude --help`: "--effort <level>  Effort level for the current session
# (low, medium, high, xhigh, max)". A flag, not CLAUDE_EFFORT: an inherited env var would
# silently give every child its parent's effort.
#
# Codex's own set is not identical — `codex debug models` reports `low|medium|high|xhigh|
# max|ultra` per model, so it accepts every level here and one more. The list stays the
# intersection-plus-claude rather than the union: a level is refused at RESOLUTION, before
# anyone knows which provider a tier names, and `ultra` on a claude tier is a spawn that
# fails at the CLI with a worse message than this one.
effort_levels = ["low", "medium", "high", "xhigh", "max"]
