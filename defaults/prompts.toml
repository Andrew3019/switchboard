# The prompt text that is not the protocol and not a role.
#
# Two kinds live here. The `[spawn]` fragments are appended to a new agent's system prompt,
# after the protocol and before its role's own prompt. The `[notify]` lines are the
# doorbell: what an agent is told when something is waiting for it in the store.
#
# All of it is flattened to one line before it is sent, so write these wrapped and
# readable. For `[notify]` that is still herdr's rule: the doorbell text is an agent
# argument (`agent prompt`), and herdr refuses any agent argument containing a newline.
# For `[spawn]` the prompt now travels as a FILE (`--append-system-prompt-file`), which has
# no line limit — the single-line rule there is switchboard's own, enforced in
# `Herdr.start_agent`, and it stays until somebody decides to lift it.
#
# `{...}` placeholders are substituted at send time. Only the ones documented on each entry
# exist; a placeholder nothing fills is a crash at spawn, so add fields to the code and the
# text together.
#
# A repo overrides individual entries in `<repo>/.switchboard/prompts.toml`; unmentioned
# entries keep their shipped text.

[spawn]

# Who this agent is, and who it answers to. Every agent gets this one.
#
# "You report to" rather than "your parent is": naming the relationship is what makes the
# protocol's `sb done` contract land on a specific reader. An agent that knows only that a
# parent exists still writes for an imagined human; an agent told that '{parent}' is the
# one who reads it writes for '{parent}'. The phrasing holds whether the parent is another
# agent or the human who ran `sb start`.
#   {name}   the agent's own name        {role}   its role
#   {parent} the agent that spawned it, or the human
identity = "You are agent '{name}', role '{role}'. You report to '{parent}': they spawned you, and your `sb done` summary is what they see of your work."

# What roles exist, told to every agent right after its own —
# DESIGN-TRUTH: "The role list is live vocabulary, not a hardcoded prompt list", which
# fixes how it is built too.
# So `{roles}` is filled from the merged role table this repo actually has
# (`Broker.roles`), and naming the shipped five in this string would be the failed version of
# this fragment even on the day it is accurate — a repo that adds `.switchboard/roles/x.md`
# gets `x` here with nothing edited, and that is the whole property being paid for.
#
# It sits next to `identity`, which already names THIS agent's role, because the question the
# list answers is the one that sentence provokes: mine is 'worker' — out of what?
#
# Names only, no descriptions. `Role` has no description field, the names are the vocabulary
# `--role` takes. A description per role means a schema change and a second thing to keep
# true; if it turns out agents pick badly from names alone, that is when to add it.
#   {roles} the role names this repo has, comma-separated
roles = "The roles that exist are: {roles}. That is the list `--role` takes. If a requested name is absent, inspect `sb roles`; use `--as` with one of these roles for an explicit custom prompt."

# Operator procedures this repo offers, told ONLY to the dispatcher (the `MAIN` role) and
# only when the registry is non-empty — a repo that `"!reset"`s it to nothing gets no
# fragment, the same way `spawn.workspace` is simply absent for an agent with no workspace.
#
# Generated live from `defaults/operator_skills.toml` (`config.operator_skills`), never
# hardcoded — same property `{roles}` is paid for above: a repo that adds an entry gets it
# here with nothing edited.
#
# An INSTRUCTION to speak, and the only one in this file that fires unprompted: the menu
# is worthless if the person in front of the dispatcher never learns it exists, and the
# older factual phrasing left dispatchers free to sit on it forever — which they did. So
# the first message is mandatory and the rest are not: once the human has seen the list,
# repeating it is noise, and the fragment says so without forbidding it outright.
#
# It fires even when `sb start` came with a task, and the earlier objection — that a
# task-bearing dispatcher must not be derailed into reciting a menu — is overruled: the
# offer is one cheap line and the human still gets their task answered immediately after
# it, which is what dispatchers were seen to do live.
#
# It is an INVITATION, not a recital. The person picks by meaning, so what they read is the
# plain-words name on its own bulleted line — `sb presets sb-setup` is the internal verb,
# unreadable as a choice. The command still travels in `{menu}` (name then command) because
# the dispatcher is the one who has to run it once they have chosen.
#   {menu} the registry as one flat "; "-separated line, `description — command`
operator_menu = "Open your very first message to the human with this offer, whatever else you say. Ask, in these words — Would you like to run any of these? — then list each procedure on its own bulleted line, named by what it does in plain words rather than its raw command, so the person can choose one by meaning; when they choose, run it for them. The procedures, given as name then command: {menu}. Afterwards, raise it again only if someone asks — repeating it unprompted is noise."

# Told ONLY to a researcher spawned DIRECTLY by the top dispatcher — the read-and-report
# role, spawned by the one agent that acts on nobody's instruction but the person's, so a
# researcher it spawns is one the person spawned on their own instruction and reads directly.
# Gated in `effective_instructions` on `role == RESEARCHER_ROLE and is_top(parent)`; a
# researcher spawned by a lead or worker is an ordinary sub-research and never sees this.
#
# A NUDGE, NOT A RULE (Andrew, 2026-09-01: "this shouldn't be a 'hard guideline' but a strong
# encouragement/nudge ... not load bearing but would be nice if it did what i wanted"). So it
# is worded as the easy default rather than a prohibition, and it deliberately does not fight
# the protocol's "finish with `sb done`" line — it says the chat-plus-block shape is what the
# person wants here, and leaves the agent free. The behaviour it encourages: report findings
# in the agent's OWN chat and `sb block` so the person reads them directly, skip the notes
# file and the `sb done`/`sb tell` back up to the dispatcher, and — the one thing worth
# telling the dispatcher — mention it if a worker or lead was spawned to carry out a fix.
#
# The person reads a `block` and the parent reads a `done` summary and nothing else, so a
# researcher that `done`s here has reported to the dispatcher, which then relays to the
# person: two hops for something the person asked for and will read directly. This closes that.
#
# IT NAMES THE RULE IT RELAXES, because it is rendered right after researcher.md, which tells
# every researcher unconditionally to write its findings to a `.switchboard/notes/` file and
# name that path (`roles/researcher.md`). Left implicit, the two would contradict each other
# in one prompt on every top-spawned researcher (PR #258 review). So this fragment is placed
# LAST (`effective_instructions`) and says out loud that the file is optional HERE — the base
# role prompt stays untouched, and the common sub-research case never sees this override.
#
# No placeholders — the parent's name is already in the identity fragment and repeating it
# here would only be one more thing to keep true.
researcher_direct = """
The top dispatcher spawned you on the person's own instruction, and they read you directly —
so one easy default here overrides what your researcher role just told you. Your role says to
write your findings to a `.switchboard/notes/` file and to name that path in your summary;
here that file is optional rather than required, because the person reads your CHAT. So the
natural shape is to put your findings in a message in your own chat — plain and skimmable, the
human-facing shape — and call `sb block`, so they read it there and you wait on them; write a
file only if you want somewhere to keep detail for later. And rather than `sb done`-ing or
`sb tell`-ing the dispatcher your findings, let that `sb block` be the report — the person
handles this with you directly, and after each thing they ask, answering in chat and
`sb block`ing again fits better than reporting done; they close you when they are finished.
The one thing still worth telling the dispatcher, just for its own information, is if you
spawned your own worker or lead to carry out a fix the person confirmed.
"""

# Added only when the agent is being placed in a named workspace.
#
# The last sentence came from the deleted `own-files` preset, which every agent used to pay
# for. Almost all of that preset was about SCOPE — edit only what you were assigned, do not
# fix a neighbouring file — and that now lives in the protocol, said once for everyone. The
# re-read rule is different in kind: it is about CONCURRENCY, and it only applies to agents
# sharing a checkout, which is exactly and only the agents who get this fragment. So it
# moved here, where the people who need it are the people who pay for it.
#   {workspace} the workspace name       {path} the checkout it sits over
workspace = """
You are working in workspace '{workspace}' at {path}. Everything you and your children do
belongs there. Other agents and the human may be in this same workspace at the same time —
it is shared, so coordinate through `sb`, and never assume you are alone in it. If a file
has changed under you since you read it, re-read it before you edit: your copy is stale and
overwriting somebody's work is not recoverable from a summary.
"""

# The first instruction a top-level orchestrator gets when `sb start` was given no task.
# It must be an instruction to STOP, not to start: the human is about to type the real one.
#
# Reword it freely, here or in a repo's own prompts.toml. An agent holding it is
# recorded as waiting for its first instruction (`agents.awaiting_task`, which is
# what keeps it out of STALLED), and that fact comes from `Broker._first_task` noticing
# that no task was passed — never from comparing the text back, which is what would go
# stale on an edit like that one.
start_task = "Await my instructions."

# The same thing for a DELEGATED child: `sb delegate` with no task at all. A parent that is
# about to be handed the real context — by the human, or by a child it is still waiting on —
# spawns the agent now and says what to do next, and the child must not invent a task out of
# its own `--name` in the meantime (#145). So this is an instruction to STOP too, and it
# names the channel the real one will arrive on, which is the one difference from a top's: a
# top is told by the person typing into its pane, a child is told by a message.
#
# Reworded freely, here or in a repo's own prompts.toml, on the same terms as `start_task`:
# the `agents.awaiting_task` flag that keeps this row out of STALLED comes from
# `Broker._first_task` seeing no task passed, never from comparing this text back.
delegate_task = "Await further instructions. Do NOT start work, and do not invent a task from your name — the real one is coming as a tagged message. If Switchboard can only send a mail notice, run `sb inbox` to read it."


[notify]

# Every string in this section reaches an agent with `[sb: from <name>]` in front of it —
# added by `broker.tag`, in code, so that overriding the wording here cannot drop the mark
# and so that `sb inbox`, which is not a prompt at all, can spell it the same way. Do not
# write a sender into these strings; it is already there.

# Fallback for a payload that cannot safely travel in one provider prompt (large,
# multiline, mixed with held signals). Ordinary short mail is sent directly, still backed
# by its durable store row, so the recipient does not pay another turn to fetch it.
#
# So an agent that reads THIS string has already missed the inline delivery, and the text
# says so rather than describing mail in general: the one action left is the fetch, and a
# recipient that has learned inline delivery is normal needs telling that this time it is
# not. Everything about what to do with the message is the message's own business.
mail = "A message could not be delivered inline. Run: sb inbox"

# One explicit waiting declaration has stayed quiet for its configured window. This is a
# targeted wake, not the retired loop that nudged every silent agent: the recipient chose
# waiting, and one prompt asks it to renew that choice or resume. No placeholders because
# the live status is deliberately read after waking rather than summarized from a stale
# collector snapshot.
wait_expired = "Your declared wait expired. Run `sb status`, then continue the work or declare the appropriate `sb waiting` state again if it is still genuinely pending."

# What restarts a parent whose turn ended while a child was working. Without this the
# parent would have to poll, which costs it a turn every time it looks.
#
# It used to fire once per child, and a parent that fanned out five of them was woken five
# times. Read as a bare summons, each wake looked like a cue to speak, so parents dripped
# one message per arrival instead of waiting for the cohort. The second sentence removes
# the implied obligation without adding payload — the message itself still lives in the
# store, which is the whole point of a doorbell. How to handle a cohort is the orchestrator
# role's business, not the doorbell's; this only stops the doorbell from arguing with it.
child_done = "A child finished and its report could not be delivered inline. Run: sb inbox. Waking is not a reason to report — use `sb waiting --all` when the whole live cohort is what you need."

# `sb tell --interrupt`. Delivered mid-turn, after an escape keypress cancels whatever was
# running, so it has to say plainly that the previous instruction is void.
#
# "Stop what you are doing" said the wrong half. An agent reads it, stops, does the new
# thing — and then goes back to what it was doing before, because nothing told it not to.
# The instruction is CANCELLED, not paused, and that has to be stated: an agent resuming a
# superseded task after the human has already redirected it is the failure this exists to
# prevent. It ends by naming the recovery, so an agent that genuinely was mid-something
# irreversible has somewhere to go other than guessing.
#   {text} what the sender typed
interrupt = "[INTERRUPT — stop now] The instruction you were following is cancelled; do not resume it. Do this instead: {text} — if stopping has left something half-done, say so with `sb block` before you go on."

# `sb tell --needs-reply`. Appended to the direct payload or, on fallback, to that
# message in the recipient's `sb inbox` output.
#
# The whole of the feature is this sentence: the sender is waiting for an answer and is
# NOT blocked waiting for it, so the recipient owes a reply at some point but owes it
# nothing right now. Both halves are stated. Dropping the second half makes the reader
# think it must stop and answer now, and costs it the turn it was about to spend; dropping
# the first leaves the sender waiting on a reply nobody knows to send.
#
# It names the SENDER as the one to reply to, in those words. `--needs-reply` is purely
# agent-to-agent — a human is never a sender here, since they type into a pane rather than
# using `sb tell`, and can never be a recipient at all — so "reply to whoever sent this" is
# the whole of the instruction, and an agent that reads it as "report to a human" or
# "answer your parent" has been sent somewhere nobody is waiting.
#   {who} the agent that sent the message, and the one owed the reply
needs_reply = "[reply needed] The sender, {who}, is waiting for a reply to this — send it back to them, not to anybody else. Nobody is blocked on it and it does not interrupt what you are doing, but answer it at some point, with `sb tell {who} \"...\"`, before you finish."

# `sb presets <name> --apply`. The preset's own text, delivered to the agent that asked for
# it — sender and recipient are the same agent, which is the only place that happens.
#
# It travels INLINE, like `interrupt` and unlike the doorbell: the payload IS the point, and
# a doorbell would cost the agent a turn on `sb inbox` to fetch text it just asked for by
# name. It does not cancel anything, so nothing here says stop.
#
# The name is repeated in front of the body so that a transcript read later says which
# procedure this wall of text is, and so an agent that applies two can tell them apart.
#   {name} the preset             {text} its text, already flattened
preset = "[preset: {name}] You applied this to your own session — it is part of your instructions from here on, not something to reply to. {text}"

# A capability grant, told to the agent that received it (`sb grant`, §2.1). Written in
# the grant's own transaction, so this message exists exactly when the capability row does.
#
# It says three things, and each is there because leaving it out breaks the point of
# signalling at all: WHAT changed (an agent that does not know it holds a capability does
# not use it, which is the whole failure this closes), WHO decided (rights are always
# somebody else's to give, and the recipient may need to go back to them), and — the half
# that is easy to get wrong — WHETHER IT MAY USE IT ITSELF, because a `--delegable` grant
# widens only what its children are seeded with and never what it may do.
#
# There is no revoke and no expiry: the grant lasts as long as the agent does, and
# `restore` starts a fresh lifetime from the stored seed. Saying so here stops an agent
# hoarding a capability for later out of a fear that it is about to be taken away.
#   {cap} the capability     {granter} who granted it     {use} what it may do with it
#   {why} the reason, already formatted, or empty
granted = "[capabilities changed] {granter} granted you the capability `{cap}`.{why} {use} It lasts for the rest of this agent's life — there is no revoke and no expiry — and it is not carried over if you are closed and restored."

# The `{use}` half of `granted`, for a grant the agent HOLDS: it may do the thing.
#   {cap} the capability
granted_held = "You may now do it yourself: every gate that asked for `{cap}` will let you through, and it is also passed down to what you spawn."

# The `{use}` half of `granted`, for a `--delegable` grant. The distinction is the whole of
# #163's motivating case and stating it plainly is the only thing that stops the recipient
# trying the action itself and reading the refusal as a bug.
#   {cap} the capability
granted_delegable = "This one is PASS-THROUGH ONLY: you may NOT do it yourself — a gate asking for `{cap}` still refuses you — but the agents you spawn are seeded with it and they may."

# A WORKSPACE RE-ATTACH, over the same in-transaction channel as `granted` above (C4).
# The agent's PLACE has changed, which is the one fact it cannot discover by carrying on:
# it would keep working in the checkout it was started in while the store says otherwise.
# So it says where it now is, whose branch that is, and who moved it — the same three
# things `granted` says, for the other kind of change. Nothing here asks it to re-scan
# anything: the message IS the change, and the gutter redraws with the ring that carries it.
#   {workspace} the workspace name        {who} who attached it
#   {where} the checkout clause, already formatted     {branch} the branch clause, or empty
attached = "[workspace changed] {who} attached you to the workspace `{workspace}`.{where}{branch} This is where your work belongs from now on — start your next command there rather than in the directory you were spawned in."

# A PROMOTE, told to a re-homed child (§2.3, F2), over the same in-transaction channel as
# `granted` and `attached` above (C4). This is the one fact the child cannot discover by
# carrying on: "You report to '{parent}'" was baked into its spawn prompt exactly once and
# is now stale, and an agent that believes it still reports to a closed proxy is the silent
# divergence the signal rule exists for. The plumbing follows on its own — `sb tell parent`
# resolves live — so the message says only what changed and what did NOT: nothing about its
# task, its checkout or its pane moved, and it is not being asked to redo or re-scan a
# thing.
#   {who} the agent that promoted it (its old parent, now finished)
#   {parent} who it reports to now, already quoted — or the human clause, for a root
promoted_child = "[you report somewhere else now] {who} has finished and handed you up a level. You no longer report to {who}: from now on you report to {parent}. Your `sb done` summary goes there and `sb tell parent` reaches there. Nothing else changed — same task, same checkout, same pane — and there is nothing to redo."

# The other half of a promote: told to the GRANDPARENT, which gains direct children. It
# rides in on the `done` message that agent is already receiving in the same transaction,
# as one more line rather than a separate doorbell, so it is worded to be read directly
# under a summary. It is the party that would otherwise read the board it swept a moment
# ago and close agents it never saw — hence the explicit note about `cleanup` scope.
#   {who} the agent that promoted (whose summary this line sits under)
#   {children} the re-homed agents, comma-separated
promoted_to_you = "[promote] {who} handed its children up to you before finishing: {children} — reporting to you DIRECTLY from now on. Their summaries come to you, `sb cleanup` under you now reaches them, and they are still in the panes and checkouts they were already in — nothing moved but the reporting line."
