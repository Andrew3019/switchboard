# Which plugins are enabled.
#
# A plugin is a Python package — `defaults/plugins/<name>/` or a repo's own
# `.switchboard/plugins/<name>/` — that owns a CLI verb and a directory of durable state.
# A preset is markdown and cannot run; a plugin is Python and can. Presets and their
# bindings live in `presets.toml`, which is a different file for a different thing.
#
# Three states, and this file sets the middle one:
#
#     available   sb can see it and describe it        present in either directory
#     enabled     its commands dispatch, it gets       listed here
#                 a state directory
#     bound       its `@<name>` fragment goes into     listed in presets.toml
#                 every spawn it is bound to
#
# Enabling and binding are separate on purpose. Enabling costs a directory under the
# repo's shared `.git`; binding costs context in every system prompt, forever. Those are
# different decisions with different costs, and collapsing them would make "use
# `sb plugin todo` myself without taxing every spawn" impossible to say.
#
# Layered like everything else: shipped first, then `<repo>/.switchboard/plugins.toml`,
# arrays joining rather than replacing. To turn everything off in one repo:
#
#     enabled = ["!reset"]
#
# `report-bug` ships ON and bound. `todo` ships OFF — present on disk, so `sb plugin list`
# still describes it and one line here turns it back on, but its commands do not dispatch,
# it gets no state directory, and no spawn carries its fragment. It was on by default and
# came off because nobody could say what it was doing for them: an agent told to consult a
# shared list before starting is being taxed on every spawn for a coordination mechanism
# that only pays off if somebody is actually reading and writing that list. Turn it back on
# when there is a workflow that wants it, not because it is available.
#
# This is the single-user assumption cashed in directly. An off-by-default plugin that its
# only user turns on in every repo he touches is a line of ceremony, not a guarantee — the
# hazard default-off protects against ("a repo you cloned decides what goes under your
# .git") needs somebody else's repo to exist first. When plugin code starts arriving from
# somewhere other than this directory, or a second person installs one, flip these two
# lines back; the three states stay separately settable precisely so that is two lines and
# not a redesign.
#
# The cost, stated rather than discovered: any repo where `sb plugin todo` is run grows
# `<shared .git>/agentflow/plugins/todo/`, and every spawn everywhere carries both
# fragments. `enabled = ["!reset"]` here turns the commands off; `all = ["!reset"]` in a
# repo's presets.toml keeps the commands and stops the per-spawn tax. They are different
# levers because they are different costs.
enabled = ["report-bug", "suggestions"]
