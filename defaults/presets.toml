# Which presets apply where.
#
# A preset is one markdown file in `<repo>/.switchboard/presets/<name>.md`, flattened to a
# single line and appended to a spawn's system prompt. This file says which of them a role
# gets automatically; `sb delegate --with <name>` adds more per call.
#
# Layered, most general first, each layer APPENDING:
#
#     defaults/presets.toml  ->  <repo>/.switchboard/presets.toml  ->  --with
#
# Appending, not replacing. A repo adding one binding cannot silently drop a shipped one,
# and a caller cannot drop what the repo decided every agent gets. To start from nothing
# anyway, make `"!reset"` the first element of the list:
#
#     all = ["!reset", "own-files"]
#
# A name here is a preset file. A name with an `@` in front of it is a PLUGIN's fragment —
# the `agent.md` shipped by the plugin of that name, which has to be enabled in
# plugins.toml:
#
#     all = ["own-files", "@todo"]
#
# The sigil is what lets a preset and a plugin share a name, and it makes the provenance of
# every injected line visible here. It is also required: a bare `todo` naming an enabled
# plugin is an error rather than a literal, because otherwise it would ship the one-word
# string "todo" into an agent's system prompt and look like it had worked.
#
# An `@name` that does not resolve is SKIPPED with a warning when it comes from this file,
# and an error when someone typed `--with @name`. A half-installed plugin must not stop the
# fleet spawning; a fragment you asked for by hand must not vanish silently.
#
# Kept out of roles.toml deliberately: a role is what an agent IS (its tier, its
# disposition, its own prompt), a preset is behaviour injected into it. Mixing the two made
# "add a preset" look like "redefine the role".
#
# Preset FILES layer the same way everything else here does: a repo's
# `.switchboard/presets/<name>.md` REPLACES the shipped one of that name. (This comment
# used to say the opposite. It was wrong — see `presets.available()`, and the shipped
# bindings below, which name files that therefore have to ship.) The protocol is what every
# agent needs; a preset is what some agents need, and a repo that disagrees with a shipped
# one overrides the file rather than arguing with it.
#
# This file was `plugins.toml` until "plugin" was needed for the other thing — a preset is
# prompt text and cannot run, a plugin is Python and can. A repo still holding
# `plugins.toml` is read from there until it moves; see `config.path_for_legacy`.

# Applied to every agent, whatever its role. Paid on every single spawn, so the bar is
# "genuinely universal" and nothing that is merely useful belongs here.
#
# One entry clears it: `@report-bug`, because an agent that works around an sb bug silently
# costs everyone after it more than the bug did, and no other mechanism catches that.
#
# `@todo` used to be here too, on the reasoning that a shared list nobody is told about is a
# list nobody reads. True, and not sufficient — the fragment is paid on every spawn forever,
# and the list only repays that if somebody is actually working from it. The plugin is now
# disabled in plugins.toml as well; re-binding it here without re-enabling it there would
# ship a fragment naming commands that do not dispatch.
#
# Capped at [limits] plugin_fragment. Note the cap was 400 when this fragment was written
# and is now 4000, so it is currently shaped by a constraint that no longer applies.
#
# A repo that does not want the tax says `all = ["!reset"]` in its own presets.toml. That
# keeps `sb plugin todo` working for the human and stops it being told to every spawn —
# which is the one thing collapsing "enabled" and "bound" into one state would have made
# impossible to say.
all = ["@report-bug"]

# Per-role additions, appended to `all`.
#
# These three came up out of `.switchboard/presets.toml`, where they had been sitting as
# repo-local config that was really just the right answer. `verify` on qa is definitional —
# a qa agent that does not run anything is not doing qa. `evidence` on the three roles whose
# entire output is a claim about something they read is the same kind of statement. What
# stayed behind is genuinely local: nothing.
[roles]
researcher = ["evidence"]
reviewer   = ["evidence"]
qa         = ["verify", "evidence"]
