# Everything else that is configuration rather than code: where files live, what things are
# called, how big they may get, how long we wait, and how often we retry.
#
# A repo overrides any of it in `<repo>/.switchboard/settings.toml`, one key at a time —
# tables merge, so setting `[limits] text` leaves every other limit alone. Arrays JOIN
# rather than replace; put `"!reset"` first to replace instead.
#
# Two exceptions: `[paths] repo_dir` and `[paths] shared_dir` are read from THIS file only.
# They name the directories a repo's own settings are read from, so a repo cannot use them
# to move itself.


[paths]
# The repo's own configuration layer, relative to the repo root. Per MACHINE: gitignored in
# switchboard's own repo, and in a fleet worktree it is a symlink to the main checkout, so
# git cannot track through it either way.
repo_dir = ".switchboard"

# The repo's COMMITTED configuration layer, between the shipped one and the local one.
# Ordinary tracked files, so a fresh clone has them and every worktree gets its own real
# copy. This is where a repo puts what everyone working on it should get — its house rules
# — as against `.switchboard/`, which is what this checkout alone wants.
#
# Presets only, for now: `presets.toml` and `presets/<name>.md` within it, read under the
# same key names as the local layer. Nothing else is layered here, because nothing else
# needed to travel and a config layer that only half exists is worth less than a small one
# that is complete for what it covers.
shared_dir = ".switchboard-shared"

# Within it. Roles may be a single TOML file, a directory of markdown files, or both —
# roles.toml first, then roles/, so the more specific form wins field by field.
roles_file    = "roles.toml"
roles_dir     = "roles"
models_file   = "models.toml"
presets_file  = "presets.toml"
presets_dir   = "presets"
protocol_file = "protocol.md"
prompts_file  = "prompts.toml"
settings_file = "settings.toml"

# The operator procedures this repo offers — the dispatcher's menu, one `[[skill]]`
# table per entry. Array-of-tables, so a repo's entries JOIN the shipped ones.
operator_skills_file = "operator_skills.toml"

# One directory and one file, each meaning two things during the transition — and needing
# no disambiguation, because the two are told apart by SHAPE rather than by name:
#
#   .switchboard/plugins/       a `<name>.md` FILE is a pre-rename preset (read only while
#                               `.switchboard/presets/` is absent — see
#                               `config.path_for_legacy`); a `<name>/` DIRECTORY with an
#                               `__init__.py` is a plugin package.
#   .switchboard/plugins.toml   top-level `all` / `[roles]` are pre-rename preset bindings;
#                               `enabled = [...]` is plugin enablement. The keys are
#                               disjoint, so a file holding both parses correctly as both.
#
# So these are not legacy keys to be retired: they are where plugins live. What was
# retired is the pre-rename MEANING of what is found there, and nothing new should be
# pointed at that.
plugins_file  = "plugins.toml"
plugins_dir   = "plugins"

# Plugin state for `SCOPE = "user"` — per machine rather than per repo, for a plugin whose
# data is a fact about the tool and not about whichever repo you were standing in. Repo
# scope needs no entry: it is `<shared .git>/<store_dirname>/plugins/<name>/`, keyed on the
# same repo identity as the store.
user_state    = "~/.local/state/switchboard"

# Per-user, between the shipped tiers and the repo's. Tiers only: this is where you say
# what `strong` means on YOUR machine, and it is not shared with anyone.
# SWITCHBOARD_MODELS_CONFIG overrides it.
global_models = "~/.config/switchboard/models.toml"

# The store lives under the repo's shared `.git`, which every worktree already sees — this
# is the directory name inside it. Required, not a convenience: a top-level orchestrator on
# the main checkout and its children in worktrees must share one store or parent links do
# not survive.
store_dirname = "agentflow"

# Config that must follow work into a worktree, symlinked from the main checkout. Local
# setup, not source, so it is never committed — there is exactly one true copy and no
# per-worktree `sb init`.
linked_config = ["CLAUDE.md", ".switchboard"]


[vocabulary]
# Names, not behaviour. Every one of these used to be a string literal in Python.

# The two addresses that are not agents. `parent` is an ordinary target; `human` is not a
# target at all — a person has no mailbox, so `sb tell human` is refused and points at
# `sb block`. The name is still needed to recognise that case.
human  = "human"
parent = "parent"

# The role `sb start` spawns — the top, and the only agent that is one. It holds no task
# and no context: its job is to hand what it is given to a lead, so that every follow-up
# continues with the agent that has the context. Everything nested is a `lead` instead,
# at any depth, and that role holds everything about its task. The two used to be one
# role at every scope; the split exists because "hold everything" and "hold nothing" do
# not fit in one prompt without a conditional, and a conditional gets read selectively.
main_role = "dispatcher"

# Old role names that still work. A name here resolves to the role it points at — fields,
# prompt and display name — instead of falling through to `fallback_role` below, which is
# the difference between a stale `--role orchestrator` behaving as a lead and it silently
# spawning an agent that cannot delegate at all. `orchestrator` maps to `lead` rather than
# to `dispatcher` because that is what anyone typing it at `sb delegate` meant: an agent
# that owns this piece of work and splits it. Empty it once nothing types the old name.
#
# What the rename does NOT reach, which matters on the day it lands. A running agent keeps
# the prompt it was spawned with, so no top already up becomes a dispatcher — it goes on
# being an orchestrator, holding context and doing its own planning, until it is restarted,
# and every row already in the store goes on saying `orchestrator` forever. Both are
# harmless because nothing decides anything from that string: `roles.get` resolves it here,
# and everything structural reads the `is_top` stamp instead (`store.live_tops`, which
# filtered on the role name until this rename made the running tops invisible).
role_aliases = { orchestrator = "lead" }

# The default NAME of the agent `sb start` spawns — separate from its role, so that
# `sb start` with no arguments lands you somewhere obvious.
main_name = "main"

# What `sb delegate` uses when no `--role` is given.
default_role = "worker"

# What an UNDEFINED role inherits — its fields, never its name. `--role archaeologist`
# works with nobody having defined an archaeologist; it just behaves like this one.
fallback_role = "worker"

# What a role file gets for a tier it does not name. No shipped role names one, so this is
# what every role gets — and it is what a role somebody wrote in three lines gets too,
# which is exactly the case that should not have to know what a tier is called.
default_tier    = "default"

# What a new worktree is forked from when `--base` is not given. The REMOTE-tracking ref,
# not the local branch: a local `main` is however stale the last `git pull` left it, and a
# fork from it starts life behind. It is fetched on the spot before every fork, and falls
# back to the local branch when there is no remote to fetch from (see `Broker._fork_base`).
# setup: { type = "string", hint = "this repo's default branch as a remote ref, e.g. \"origin/master\"", when = "only ask if the repo's actual default branch isn't main — check it, don't assume" }
base_branch = "origin/main"

# How `sb done "<summary>"` reaches the parent's mailbox. Readers strip it, so the prefix
# stays an implementation detail of the mailbox rather than something everyone must know.
done_prefix = "[done] "

# There is deliberately no `blocked_prefix`. A block is not mail: the human has no mailbox,
# so `sb block` records the reason against the agent and it reaches you as a marked row on
# `sb board`, which needs no marker in the body to tell it apart from anything else.


[states]
# Groupings of the store's states. The state names themselves are the store's schema; which
# of them count as what is policy, and policy belongs here.

# Still going, and therefore contradictable by what herdr says the pane is doing.
running = ["working"]

# Has never reported an end, and so a pane that disappears under it is a death worth
# recording (`status.REAPABLE`). Wider than `running` by exactly one word, and the word is
# the point: a blocked agent is legitimately not working — it has stopped to ask a person
# and sits there until answered — so it must never be contradicted for being idle, which is
# what `running` decides. But if its pane goes, nothing more is coming from it either, and
# before this it was never reaped, never marked failed and never reported to its parent; it
# stayed BLOCKED on the board for good. The signal that separates the two is the pane, not
# the state, and only `gone` reads this list.
reapable = ["working", "blocked"]

# Will never move again. Waiting on one of these is waiting forever.
finished = ["done", "failed"]

# Counts as "an agent is live", which is what makes the store refuse to drop and recreate
# itself on a schema change.
live = ["working", "blocked"]

# herdr's `done` is a display state meaning "idle and not looked at yet". For drift it
# means exactly what idle means: no turn is running. Treating it as its own thing is how a
# stalled agent gets missed.
idle_like = ["idle", "done"]

# The two words `agents.turn` can hold — switchboard's OWN activity signal, written by the
# hooks in `hooks.py` at the two edges of a turn. Listed here for the same reason the
# groupings above are: the words are the store's schema, and this is the one place the
# writer (`store.set_turn`) and the readouts (`status`, `Broker._busy`) agree on how to
# spell them. Not something to retune — they are the two edges Claude Code fires, not a
# policy — and `turn_idle` in particular is NOT a state and never becomes one: the state
# column's vocabulary is working | blocked | done | failed and stays four words.
turn_working = "working"
turn_idle    = "idle"


[sweep]
# The automatic worktree sweep — `switchboard/sweep.py` for the rules, `Broker.sweep` for
# what acts on them. Read that module before changing a number here: every one of these is
# a policy Andrew settled on 2026-08-16, not a tuning knob somebody guessed at.

# Whether a board sweeps at all. False leaves `sb sweep` working when typed by hand, and
# is how a machine opts out of the automatic half without editing code.
enabled = true

# Seconds between ticks. 1800 puts them on :00 and :30 of the system clock — the slot is
# `epoch // period`, so any period that divides an hour lands on the clock rather than on
# whenever the board happened to start. A sweep runs from a BOARD, so no board running
# means no sweep at all; that is the accepted cost of not having a daemon.
period = 1800.0

# How old a worktree must be on BOTH clocks — last agent activity in the workspace, and
# last commit date — before it may be deleted. Either one being more recent than this
# holds it open. 24h.
min_age = 86400.0

# A stranded commit is docs-only if every file it touches is a `.md` or lives under one of
# these. Path-based, deliberately: see `sweep.docs_only`.
# setup: { type = "list", hint = "directory names (repo-root-relative) this repo's docs/notes live under, IN ADDITION to the shipped ones" }
docs_dirs = ["notes", "design", "learnings", "research"]

# ...except these, which are never docs however they are spelled. DESIGN-TRUTH.md is the
# only trusted document in the repo and only Andrew edits it, so an unpushed change to it
# is not a note somebody can regenerate.
# (single-quoted, which in TOML is a literal string: a double-quoted one next to that name
# reads as an unterminated citation to `tests/test_design_truth_refs.py`.)
# setup: { type = "list", hint = "any file that's never docs however it's spelled, e.g. this repo's one trusted doc" }
docs_never = ['DESIGN-TRUTH.md']

# Shortest commit subject the squash-merge check will match on (`sweep.stranded`, rule 3).
# A subject shorter than this — "wip", "fix" — would match half a history.
min_subject = 12

# Whether ignored content in a checkout holds it back from an automatic sweep the way it
# holds back `sb workspace close` without `--yes`.
#
# FALSE, and this is the one rule here that is not straight from Andrew's list. Every
# worktree in this repo carries ignored files — `__pycache__/`, `.pytest_cache/`, and the
# `.switchboard` symlink switchboard itself planted — so with this true the sweep refuses
# all 147 of them and deletes nothing, which is not a conservative sweep, it is no sweep.
# What still holds a checkout open is work git can SEE: anything modified or untracked is
# an unconditional refusal (`_inventory_gate`), and that is where uncommitted work lives.
# The exposure this accepts is an ignored file somebody meant to keep — a real `.env` in
# an agent's worktree — going with the checkout. Set it true to get the refusal back.
ignored_content_holds = false


[limits]
# Caps, in characters. None of these is a buffer limit; they are smell detectors.
#
# RAISED DELIBERATELY, and the reasoning is worth keeping because the old numbers were not
# wrong so much as premature. They were set as style advice with an exception behind it: a
# summary of 4001 characters is not a bug, it is a long summary, and refusing it turns a
# matter of taste into an agent that cannot report at all. Nobody had hit them; they were
# guesses about behaviour nobody had observed yet.
#
# So the caps that remain exist to stop a RUNAWAY — an agent pasting a transcript into a
# mailbox, a loop appending forever — not to enforce brevity. Brevity is the protocol's job
# and the roles', where it is said in words and can be judged. Lower any of these the day
# something actually goes wrong, and write what went wrong next to the new number.

# NOT ours and NOT tunable in practice: herdr requires [a-z][a-z0-9_-]{0,31}. Raising this
# does not raise herdr's rule; it only makes sb accept a name herdr will then reject, which
# is strictly worse than refusing it here where the error can say so. Leave it.
agent_name = 32

# A task, a message, a question, a summary. The protocol still says pass file paths and
# never file contents, and that remains the right instruction — but it is an instruction,
# and this number is now only the runaway guard behind it.
text = 40000

# `sb block "<why>"`. NOT a runaway guard and not style advice — the only cap here that is
# load-bearing, because the reason is the one field whose SIZE tells the agent it is using
# the verb wrong. The human never reads it (he reads the agent's own chat, via
# `sb inspect`); it is bookkeeping on a board row. An orchestrator wrote its entire answer
# to him into a `why` — several paragraphs, findings and questions — left its own chat
# empty, and when the newline check refused it, flattened the whole thing into one run-on
# line and got through. 200 characters is roomy for the one line this is meant to be and
# has no room at all for a report, which is the only way to make the flattening trick fail
# too. Raising it re-opens that hole; the capability it appears to take away is not lost —
# long text goes in the chat, which is where he actually reads it.
block_reason = 200

# Authored prompt text (`--as`, and preset files after flattening). Config rather than
# traffic: a preset is allowed to be a substantial briefing, and the orchestrator role is
# already ~4.7k on its own. Kept strictly ABOVE `text` — authored config should never be
# the thing that hits a cap before a runaway message does.
prompt = 80000

# One plugin's `agent.md` fragment, after flattening. Still the smallest of the three, and
# still for the reason protocol.md's header gives — everything in a system prompt is "paid
# for on every single spawn, by every agent, forever" — but 400 was tight enough that both
# shipped fragments were written to fit the cap rather than to say the right thing, which
# is the cap editing the prose. Over-budget text is truncated at a word boundary with an
# event logged, never rejected: a chatty plugin must not break spawning.
plugin_fragment = 4000

# A workspace name is used verbatim as a git branch name. Refs have no real length limit,
# but a path built from one does, and nothing legitimate comes close.
ref = 200

# `--model` and friends: an identifier, not prose.
token = 64

# A task line in `sb status`. Long enough to say what an agent is doing, short enough not
# to wrap a terminal.
task_clip = 96

# One transcript entry becomes one line in `sb inspect`, clipped rather than wrapped: a
# 200-line tool result would push the actual failure off the top of the window.
output_clip = 400

# A desktop notification. Anything past this is truncated by the OS anyway.
notify_clip = 120

# How much of a summary or a reason is copied into the event log.
event_clip = 200

# How much of a herdr call's stdout/stderr is copied into the event log. Bigger than
# event_clip because this is what a spawn failure is diagnosed from.
herdr_log_clip = 500


[timeouts]
# Seconds, unless the name says _ms.

# How long a `working` row must stay CONTINUOUSLY absent from herdr before that absence is
# recorded as a death (`status.GONE_CONFIRM_GRACE`). A single missing reading is
# indistinguishable from a herdr hiccup; a run of them is a death, and this one is the
# store writing a verdict nothing else will ever revise. It is not bound to the spawn
# window: `gone` is already forced false for a row that is still spawning, so nothing here
# can be confirmed dead during its own spawn.
gone_confirm_grace = 60.0

# How long an unexcused idle agent must STAY idle before that idleness is read as a stall
# (`status.STALLED_FLOOR`). The floor under `stalled`, which until now had no duration term
# in it at all: the `Stop` hook writes `turn='idle'` at the end of every turn, so an
# ordinary worker that ends a turn was stalled at ZERO seconds — pinged by the reconciler
# and put in front of a person in the same instant, including the agent that ran
# `sb tell --needs-reply` and ended its turn to wait exactly as the protocol tells it to.
#
# Three seconds, and small on purpose. This is not the debounce and must not grow into one:
# `display.needs_settle` is the 30 s window that decides when a BOARD summons a human, and
# it is sized against the long tail of turn gaps and spawns. This is the floor under
# everything that acts on a stall WITHOUT that debounce — the reconciler's ping,
# `sb status --needs-me`, `--json`, DRIFT — and its whole job is to stop zero. Measured
# against the same store the debounce was sized from: `turn_end` to the next `turn_start`
# was under 3 s for 2.1% of 523 resumed turns, so this alone clears the sharpest edge of
# the flicker, and the 30 s window covers the rest of it on the one readout that has a
# collector behind it to time it.
#
# Erring long here would delay a real stall on the paths that have no other guard, so it is
# deliberately the smallest number that is not zero and still means something.
stalled_floor = 3.0

# How long a `working` turn edge must have NOTHING behind it before that edge is doubted at
# all (`status.TURN_STALE_GRACE`). Measured, not guessed: across 406 real agent sessions in
# this repo, the longest a live agent goes inside one turn without running an `sb` command
# is 20.6 min at the 99th percentile, and the longest single tool call ever recorded here
# ran 18 min. 30 min clears both. The tail goes much further — 139 min at the 99.9th — so
# this deliberately does NOT decide anything on its own; it only says when a row becomes
# worth asking herdr about. See `turn_doubt_grace`, which is what decides.
turn_stale_grace = 1800.0

# How long that doubt must hold CONTINUOUSLY, with herdr reporting no turn in the pane at
# every reading in between, before the edge is dropped (`status.TURN_DOUBT_GRACE`). This is
# the half that carries the decision, and it works because herdr's busy detector is
# intermittent rather than dead: a genuinely
# working agent gets a `working` reading out of it sooner or later, and one such reading
# anywhere in this window clears the doubt — as does one `sb` command from the agent. An
# agent that is quiet because its turn really ended never produces either. 15 min is a long
# run of readings to lose (the board looks every 2 s), and the whole delay from the lost
# edge is this plus `turn_stale_grace`.
turn_doubt_grace = 900.0

# How long `sb tell --interrupt` lets the escape keypress land before sending the new instruction.
# Without the pause the interrupt races the cancel and can be swallowed by the turn it was
# meant to stop.
interrupt_settle = 0.5

# How long a doorbell is given to reach the target's own transcript before
# `Broker._confirm_rings` treats it as never submitted and sends it again — and how long
# each repair is then given in its turn. NOBODY WAITS THIS OUT: the sender returns the
# moment the ring is on the wire, and this only says how OLD the last thing we did about a
# ring has to be before the next `sb` command anyone runs is allowed to judge it.
#
# Set by the slower of the two ways the evidence can appear, because the whole cost lives on
# that side. A BUSY target's queue record was readable 2.29 s after the send. An IDLE target
# writes no queue record at all, and its `user` record took 14.59 s — Claude Code flushes
# that file when it gets round to it, and `deliver_working_ms` and `Herdr._took_prompt` both
# record **35 s** for that same flush under a six-way fan-out. FORTY-FIVE is that worst case
# plus a margin of roughly one collector tick, so the first judgement lands past it rather
# than on top of it.
#
# It was 30 s, which is below the 35 s figure its own comment cited — the fan-out case is
# precisely `delegate`'s shape, so the agents most likely to be judged unconfirmed while
# perfectly fine were the busiest ones in the fleet.
#
# A FLAT number, not the conditional stretch `_took_prompt` uses for the identical lag, and
# the difference between the two is who is waiting. `deliver`'s window is a sender blocked
# on it, so it must be short by default and lengthen only when it must. Nobody waits on this
# one at all — it is staleness, not delay — so buying certainty with a longer flat window
# costs nothing, while the stretch would need `_busy`, whose own docstring records herdr's
# busy detector going dark for every Claude pane on the machine. Wrong there means "not
# busy", means the short window, means exactly the spurious repair the stretch was for.
#
# Five seconds — the number the design note first proposed — would have re-sent on most
# correct deliveries to an idle agent, and that duplicate is not free: the first doorbell
# already started its turn, so the second arrives mid-turn and buys the agent a whole extra
# turn to find an empty inbox. Erring the other way costs only how long a genuinely dropped
# Enter sits before it is repaired, and against today's behaviour — stranded for ever, with
# nobody aware — forty-five seconds is not a cost.
ring_settle = 45.0

# How long `sb workspace close` lets the panes it just closed leave the process table
# before the re-confirmation is allowed to refuse on them. `pane close` returning is not
# the shell having exited: measured on this machine, an idle shell and a shell with an
# ordinary child are gone before the scan lands (~68ms, which is the scan's own runtime),
# but a process that catches the hangup and winds down is still there at the first look
# and stays for as long as its shutdown takes. Refusing on those costs the panes, because
# the re-confirmation runs after they are down. This only delays the answer; it never
# changes what counts as live, so anything that is still there when it expires refuses
# exactly as it would have.
teardown_settle = 3.0
teardown_settle_poll = 0.1

# sqlite. Many short-lived `sb` processes write to one file, so a busy database is normal
# and waiting is the right response to it.
database = 10.0

# Any `git` or `herdr` call, inside the adapter or out. Bounded so a hung binary cannot
# wedge an `sb` invocation — it once wedged one for over a minute, until a human killed it.
# The adapter's slow calls (`agent start`, `agent wait`, a worktree checkout) do not get
# this flat number: they get their own deadline plus this as the margin to return within.
subprocess = 10

# `agent start`. Generous: spawning a Claude Code session in a fresh pane is slow.
spawn_ms = 90000

# `agent wait`, the adapter's own ceiling.
agent_wait_ms = 300000

# Delivering a task with `agent prompt`: how long the agent has to actually start a turn
# before the send counts as not taken, and how often that is checked. Twenty seconds
# because the only thing being waited for is herdr reporting a state change on a session
# that is already interactive — a fresh spawn's slowness is `spawn_ms`, and it has already
# been paid by the time anything is delivered.
deliver_ms = 20000
deliver_poll = 0.5

# How much LONGER the proof is waited for when, at the end of `deliver_ms`, herdr reports
# the agent is running a turn. Granted once per send, and only then.
#
# The proof of delivery is the agent's own transcript, and Claude Code does not flush that
# file when the text is submitted — it flushes when it gets round to it. Measured under a
# six-way fan-out: a task taken at 05:01:59 reached the transcript at 05:02:34, a 35 s lag
# against a 20 s window, and the spawn declared a working agent's task lost. A turn running
# is not proof the text arrived (a startup dialog can move an agent without it), so it does
# not confirm anything — it only buys the proof time to show up, which is exactly what was
# missing. An agent that never starts a turn is never granted it, so a genuinely lost task
# still fails in `deliver_ms` per send as before.
deliver_working_ms = 60000

# Pinning a spawning pane's `sb` to the checkout that pane is standing in, and confirming
# it took. One shell command and one `pane wait-output`, both against a shell that is
# already at a prompt — so this is short by design. It is paid BEFORE the agent's row is
# claimed, which is why it does not enter `status.SPAWN_GRACE`.
pin_ms = 5000

# How long the adapter pauses before re-issuing an `agent wait` that came straight back
# without the agent having moved. herdr returns instantly when the agent is ALREADY in the
# state asked for, so the stale-seq guard would otherwise re-ask as fast as two subprocesses
# will spawn — measured at 77% of a core for a six-second wait.
agent_wait_backoff = 0.5

# How long a spawn waits for its turn at creating a worktree. Only ONE `worktree create`
# per repo may run at a time (`Broker._fork_lock`), so in a fan-out the others queue here.
# The wait is a queue, not a hang: a creation is a fraction of a second of git plus herdr
# opening the workspace, so six of them clear in a couple of seconds and this number is
# nowhere near being reached. It exists so that a wedged holder — a herdr that never
# returns — costs a waiter a bounded wait and then an ordinary attempt, rather than a
# process blocked for ever on a lock nobody will release.
fork_lock = 120.0


[retries]
# Spawn is genuinely flaky — `agent start` fails outright if the pane has not yet reached
# an interactive shell prompt — and a silent failure there is what makes an orchestrator
# quietly do its child's work instead.
spawn_attempts = 3

# Linear backoff: attempt N sleeps N * this. Every failure sleeps, the last one included —
# `start_agent` naps before it gives up (`herdr.py:370`) — so three attempts is 2 + 4 + 6 =
# 12 s of backoff, not 2 + 4. Reading it as 2 + 4 is how `status.SPAWN_GRACE` came to be
# 12 s shorter than the spawn it guards; it now derives the whole worst case from here.
spawn_backoff = 2

# How many times a task is sent to an agent that never took it. Same backoff as a spawn
# retry — this is the other half of the same flakiness, and a second knob for it would only
# be a second thing to keep in step.
deliver_attempts = 3

# How many times a doorbell the target's own transcript never recorded is SENT AGAIN
# (`Broker._confirm_rings`) before we stop and log `ring_unconfirmed`. Not a delivery
# retry like `deliver_attempts`: nothing waits on these, they are made by whichever `sb`
# command happens to run next, and each one is a plain `agent prompt` — never an Enter
# pressed on a box nobody has read (see `_confirm_rings`).
#
# A HARD cap across processes, not just within one. Every attempt is claimed with a row
# written inside the store's write lock before the send (`_claim_repair`), because
# `flush_pending` runs at the head of every `sb` command and counting-then-sending let four
# concurrent commands each send "repair number one".
#
# Two, because the repair is for a keystroke the terminal dropped and a third send is no
# likelier to land than the second: what two buys is the difference between "the Enter was
# dropped" (repaired) and "this agent cannot be reached at all" (logged, and left, which is
# exactly what happened before this existed). Giving up is a LOG line and not a failure —
# the message is still in the store, still unread, and still in that agent's `sb inbox`.
ring_repairs = 2

# How many times the `sb` pin is typed into a spawning pane before the spawn is refused.
# Two, not three: the only failure it recovers from is a shell that had not quite reached
# its prompt, and if a second try a backoff later still finds nothing then the pane is not
# a shell we can pin — which is a refusal, not something to keep paying for.
pin_attempts = 2


[display]
# Defaults for the readouts. All of them are overridable per invocation by a flag.

# Lines of terminal output `sb inspect` shows.
#
# 100 because that is what the record asks for: `sb inspect` is how Andrew reads a blocked
# agent's full message, "and it should show more tail — like 100 lines" (DESIGN-TRUTH.md).
# It had drifted to 40, which is half a message. The same number is the default tail every
# pane read takes (`herdr.READ_LINES`), and that is deliberate: the tail exists to be read
# here, so one number is one decision rather than two that can disagree.
output_lines = 100

# Recent events `sb inspect` includes.
events = 12

# Rows `sb log` prints.
log_events = 30

# A transcript record can render to zero lines (thinking, meta), so the reader walks back
# this many times further than asked and trims afterwards.
record_overscan = 6

# `sb board`: how often the tree is re-collected, in seconds. ONE number for two loops —
# the collector's poll and every renderer's re-read — because a renderer re-reading faster
# than the collector writes learns nothing, and one that reads slower is showing old data
# for no reason.
#
# HALF A SECOND, and the cost was measured rather than assumed. A renderer's tick is a read
# of one small file, so its 4x costs nothing at all; the collector's tick is `herdr agent
# list` plus four queries, measured at 57 ms median on the largest store in this fleet
# (507 agents, 30 602 events) with herdr 11 ms of it. That is 11% of one core at this
# interval against 3% at two seconds, and it is a per-repo cost, not a per-pane one — the
# whole point of the collector/renderer split. On a loaded machine the same tick was
# measured at 146 ms median and occasionally near a second, which is where 4x would start
# to matter, so `collector.MAX_DUTY` caps the loop's share of a core and backs the interval
# off when a tick is slow. See that constant for the arithmetic.
board_refresh = 0.5

# How long a row's summons has to HOLD before the board shows it, in seconds — the debounce
# on NEEDS YOU. Zero disables it.
#
# `blocked` and `gone` are exempt and always immediate: a block is a state an agent wrote
# and a missing pane is an absence herdr confirmed, and neither flickers. What flickers is
# the pair that is inferred every tick — `stalled` and `at prompt` — and both are made of
# readings that go the other way a second later:
#
#   - a turn gap. `turn_end` and the next `turn_start` were within 2 s of each other for
#     2.1% of this store's 523 resumed turns, within 15 s for 9.8%. Every one of those is a
#     row that flashed STALLED and then went back to work.
#   - the cascade off it. `richboard.busy_below` reads a descendant's reconciled state, so
#     one child's two-second gap takes the excuse away from every idle ancestor at once —
#     which is what makes this show up as a whole column blinking rather than one row.
#   - a wake in progress. Mail delivered to an idle agent reached a `turn_start` within 2 s
#     in 93% of 346 deliveries, and a freshly spawned agent within 5 s in 86% of 235 spawns
#     — with a tail out to 30 s, which is the case Andrew saw sit in NEEDS YOU for several
#     frames while the pane was still coming up.
#
# THIRTY SECONDS, from that last line: it is the only one of the three with a tail worth
# sizing against, and 30 s covers 99% of it. Seconds and not frames — Andrew's "more than
# one frame" was written when a frame was two seconds, and at 0.5 s a frame count would
# mean a quarter of what it meant then. What it costs is that a genuinely stuck agent is
# summoned 30 s late, which is nothing next to how long a person takes to look; the row
# itself still says `idle` all along, and nothing that ACTS on a stall — the reconciler,
# `--needs-me`, DRIFT — is debounced by this. It only decides when to summon a human.
needs_settle = 30.0

# Board rows that are not agents, in the plain renderer — the header, the `STATS` label,
# the two lines of fleet numbers under it, the blank line that holds them off the `AGENTS`
# label, that label, and the two lines at the foot. Six when the top section landed and
# eight once it grew a header of its own; the panelled renderer counts its own head and
# does not read this.
board_chrome = 8

# Draw the archived agents too, instead of only what is still running. An agent is
# archived when herdr no longer has its pane and it is past the spawn grace — see
# `status.AgentStatus.archived`.
#
# The two readouts spend it differently, because they are read differently. `sb status`
# collapses whole archived subtrees into one `+ N archived` row; the BOARD draws no such
# row at all and simply leaves them out, and on it this setting means "also draw the
# archived rows of a tree somebody is still working in" — a subtree with no live agent
# above it anywhere is never drawn there whatever this says (`status.board_rows`).
#
# False, because the alternative is what the board did before: on the store this was
# written against, 59 of 68 rows were agents whose pane had closed, and every session
# permanently adds more. `split-tab.md` §3.1 puts that same tree in EVERY pane at half a
# pane's width, so this is the difference between a panel and a wall of dead names.
#
# Nothing is lost by it. The header still counts every agent, and DRIFT, NEEDS YOU and
# UNDELIVERED still name each one — this shortens the tree, never the readout, and
# `sb status --json` is not affected at all. Per invocation: `sb status --archived`, or
# `a` in the board.
show_archived = false


[panel]
# One collector, many renderers. See switchboard/panel.py — the collector is elected by an
# flock, publishes `sb status --json` to a file every `display.board_refresh` seconds, and
# every panel reads that file instead of the store.

# When a panel starts saying its snapshot is old, in seconds.
#
# The design asked for "one refresh interval", and taken literally that flaps: a snapshot
# is normally between zero and one interval old when it is read, so the threshold would be
# crossed by ordinary phase. Clear of that plus a margin means STALE is only ever shown for
# a tick that did not happen, which is the thing worth being loud about — a warning that
# appears half the time is one people stop reading.
#
# It stayed at five when `board_refresh` went from 2.0 to 0.5, and that is deliberate: what
# this has to clear is no longer the interval — which is now a tenth of it — but the TICK,
# and a collect on a loaded machine was measured near a second, with `collector.MAX_DUTY`
# then stretching the sleep to three times that. Five seconds sits above the worst of that
# and below anything a person would call current. Sized against the collect, not the gap.
stale_after = 5.0

# How long the collector keeps going after the last panel stops looking, in seconds. It
# outlives the pane that started it on purpose (a renderer must not take the fleet's
# collector with it when it closes), and this is what stops that becoming a daemon nobody
# owns: renderers stamp `panel/demand` as they draw, and the collector retires when
# nothing has.
collector_idle_exit = 60.0

# How often ONE renderer will try to start a collector that is not there. Without it, a
# collector that cannot start at all would be re-spawned by every panel on every tick.
spawn_cooldown = 5.0


[herdr]
# Facts about the adapter's counterpart. Not preferences — changing one of these is
# claiming something about the binary on your PATH.

# Behaviour was verified against this. Older binaries are refused by `sb doctor` rather
# than allowed to fail later in ways that name neither cause nor fix.
min_version = "0.8.0"

# One source id, forever. Authority in herdr is per-source and NOT exclusive, so two ids in
# our own code would silently fight each other.
source = "switchboard"

# What kind of agent herdr starts.
agent_kind = "claude"

# The provider CLI's default is manual, under which every agent stalls on its first tool
# call waiting for a human who is not watching.
permission_mode = "auto"


[editor]
# The CLI the board's double-`o` action shells out to. Not a preference so much as a
# claim about the binary: it must take `<folder>` to focus (or create) that folder's
# window, and `-r -g <file>` to add a file to the most-recently-active window as a tab
# rather than opening a window of its own. `cursor` and `code` both do; something else
# may not. See `board.open_report_files`.
# setup: { type = "string", hint = "the CLI your editor uses to open a folder and add a file as a tab (e.g. \"code\") — only if it isn't cursor" }
command = "cursor"
