# The test suite, on every push and pull request.
#
# Deliberately plain. switchboard is not a package and has no build: nothing here installs
# it, and the only thing installed is what the test suite itself needs —
# `requirements-dev.txt`, which is pytest plus pytest-xdist (`pytest.ini` runs `-n auto`,
# so without xdist pytest aborts at argument parsing). switchboard's own runtime
# dependency, `rich`, stays uninstalled on purpose: it is optional and the suite passes
# without it, so a green matrix also proves that. Python 3.11 is the floor because the
# config loader uses `tomllib`, which arrived in 3.11.
#
# `python -m pytest` rather than `pytest`: the `-m` form puts the working directory on
# `sys.path`, which is how `from switchboard import ...` resolves without an install step.
#
# 3.13 is deliberately absent, and not because of a test. `Path.resolve()` stopped raising
# on a symlink loop there, so `broker._resolved` hands back a path where every version
# below it answers "cannot tell" — inside the one destructive command. That is a decision
# about switchboard, not about CI, and until it is made this says which interpreters the
# suite is actually known to hold on.
#
# WHAT THIS DOES NOT COVER. There is no herdr and no tmux on the runner, so nothing here
# exercises a real pane, a real agent or a real fleet — those are proven by hand, in an
# isolated clone, as the house rules describe. The live check's real `lsof` invocation
# used to skip on Linux because its output shape was BSD's; the invocation now asks for
# the fd field explicitly, so the real scan runs on Linux too (ubuntu-latest ships lsof
# >= 4.94, the affected version) and the macOS leg covers it there as well. Everything
# else runs: a green matrix is the whole suite, not a page of skips.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The platform switchboard is actually used on, where nothing skips.
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests
